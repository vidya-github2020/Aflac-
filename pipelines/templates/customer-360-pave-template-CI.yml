# --------------------------------------------------------
# Publish Test Results to Tests Tab of Pipeline
# --------------------------------------------------------  
- task: PublishTestResults@2
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: 'junit*.xml'
    searchFolder: '$(System.DefaultWorkingDirectory)/PAVE_RobotFrameworkTests/Results/'
    failTaskOnFailedTests: false
    testRunTitle: 'Customer-360-PAVE Test Suite'
  condition: succeededOrFailed()

# --------------------------------------------------------
# Copy Test Artifacts to Staging Directory
# --------------------------------------------------------  
- task: CopyFiles@2
  inputs:
    downloadPath: '$(System.ArtifactsDirectory)' 
    SourceFolder: '$(System.DefaultWorkingDirectory)/PAVE_RobotFrameworkTests/Results'
    Contents: '**'
    TargetFolder: '$(Build.ArtifactStagingDirectory)'
  condition: succeededOrFailed()

#----------------------------
# Publish Test Report Files to be downloadable from Pipeline Job
#----------------------------
- task: PublishBuildArtifacts@1
  inputs:
    PathtoPublish: '$(Build.ArtifactStagingDirectory)'
    ArtifactName: '$(testSuite) Test Files'
    publishLocation: 'Container'
  condition: succeededOrFailed()
              
- task: ArchiveFiles@2
  displayName: Archive Test Results
  inputs:
    rootFolderOrFile: '$(System.DefaultWorkingDirectory)/PAVE_RobotFrameworkTests/Results'
    includeRootFolder: false
    archiveType: 'zip'
    archiveFile: '$(Build.ArtifactStagingDirectory)/${{ parameters.testSuite }}_${{ parameters.buildNumber }}.zip'
    replaceExistingArchive: true
  condition: succeededOrFailed()

- task: ArtifactoryGenericUpload@2
  displayName: Publish Test Results
  inputs:
    artifactoryService: 'ArtifactoryServiceConnection'
    specSource: 'taskConfiguration'
    fileSpec: |
      {
        "files": [
          {
            "pattern": "$(Build.ArtifactStagingDirectory)/${{ parameters.testSuite }}_${{ parameters.buildNumber }}.zip",
            "target": "${{ parameters.artifactoryTestResultLocation }}"
          }
        ]
      }
    failNoOp: true
  condition: succeededOrFailed()

- script: |
   sudo chown -R $USER: $(System.DefaultWorkingDirectory)
   rm -rf $(System.DefaultWorkingDirectory)/PAVE_RobotFrameworkTests/Results
  displayName: Clean Up Test Results Files
  workingDirectory: $(System.DefaultWorkingDirectory)
  condition: always()

- script: |
   export APP_NAME=${{ parameters.paveChannel }}
   export BUILD_NUMBER=${{ parameters.buildNumber }}
   docker-compose down
   docker rmi ${{ parameters.paveChannel }}-${{ parameters.buildNumber }}
  displayName: Clean Up Docker
  workingDirectory: $(System.DefaultWorkingDirectory)/PAVE_RobotFrameworkTests
  condition: always()