parameters:
- name: paveChannel
  type: string
- name: buildNumber
  type: string
- name: environment
  type: string
  default: IntG
- name: testSuite
  type: string
- name: pipelineRun
  type: string  
- name: artifactoryTestResultLocation
  type: string
- name: robotPabotCommand
  type: string
- name: robotArgs
  type: string
  default: '*'

steps:

- script: |
    echo "##vso[task.setvariable variable=PipelineRunUrl]$(System.CollectionUri)$(System.TeamProject)/_build/results?buildId=$(Build.BuildId)"
  displayName: "Set Pipeline Run URL"
  
# --------------------------------------------------------
# Creates a Docker Network & Selenium Grid
# --------------------------------------------------------
- script: |
   export APP_NAME=${{ parameters.paveChannel }}
   export BUILD_NUMBER=${{ parameters.buildNumber }}
   docker-compose up -d
  displayName: Create Docker Network & Selenium Grid
  workingDirectory: $(System.DefaultWorkingDirectory)/PAVE_RobotFrameworkTests
  condition: succeeded()

- script: docker build --no-cache -t ${{ parameters.paveChannel }}-${{ parameters.buildNumber }} -f PAVE_RobotFrameworkTests/pipelines/Dockerfile .
  displayName: 'Build RobotFramework Code Container'
  condition: succeeded()

- script: |
   ./wait_for_selenium_hub.sh ${{ parameters.paveChannel }} ${{ parameters.buildNumber }}
  workingDirectory: $(System.DefaultWorkingDirectory)/PAVE_RobotFrameworkTests
  displayName: Wait for Selenium Hub to start

- script: |
    docker run --rm \
      --env ${{ parameters.environment }}_CLIENT_ID=$(${{ parameters.environment }}_CLIENT_ID) \
      --env ${{ parameters.environment }}_CLIENT_SECRET=$(${{ parameters.environment }}_CLIENT_SECRET) \
      --network ${{ parameters.paveChannel }}-network-${{ parameters.buildNumber }} -v $(System.DefaultWorkingDirectory)/PAVE_RobotFrameworkTests:/pave --name ${{ parameters.paveChannel }}-tests-${{ parameters.buildNumber }} ${{ parameters.paveChannel }}-${{ parameters.buildNumber }} ${{ parameters.robotPabotCommand }} -x junitreport.xml -d Results/ -v remote_url:http://selenium-hub:4444 -v gEnvironment:${{ parameters.environment }} ${{ parameters.robotArgs }} -r $(testSuite)-test-report -l $(testSuite)-test-log ./${{ parameters.testSuite }}/TestSuites
  workingDirectory: $(System.DefaultWorkingDirectory)/PAVE_RobotFrameworkTests
  displayName: UI Test Suite
  failOnStderr: false
  condition: succeeded()

